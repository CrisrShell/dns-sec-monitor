# Floci — local AWS emulator for Terraform development.
# Separate from the main stack: this is a dev tool, not a project component.
services:
  floci:
    image: floci/floci:latest
    container_name: dns-floci
    ports:
      - "4566:4566"
    volumes:
      # Floci launches real containers to emulate EC2 instances, so it needs
      # access to the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock