[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-monitor"
version = "3.0.0"
description = "Real-time DNS tunnelling detection using Shannon Entropy and statistical analysis"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "CrisRC" }
]
keywords = ["dns", "security", "monitoring", "tunnelling", "entropy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0",
    "elasticsearch>=9.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
dns-monitor = "dns_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[[tool.mypy.overrides]]
module = ["pandas.*", "urllib3.*", "elasticsearch.*"]
ignore_missing_imports = true